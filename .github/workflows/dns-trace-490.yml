# Diagnostic PR workflow. pull_request runs this file from the PR branch.
# Do not merge to main first. Do not re-run to seek a green sample.
#
# One macos-26 job, three records, each once. A failure does not skip the rest.
#   1. Unmodified host selftest, LJ466_TIME=1. Its exit is the original
#      500/1500ms assertion record. Product source, the 80ms gap, and those
#      limits stay as they are.
#   2. solo tracer: one address, no delay, same fixture as resolve-one.
#   3. pair tracer: the original 80ms second address.
# Tracer walls include trace bookkeeping and are not the 500ms acceptance.
# Child qos_* is the fake dns-sd process only.
name: dns-trace-490

on:
  pull_request:

permissions:
  contents: read

jobs:
  trace:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record runner identity
        run: |
          {
            echo "git $(git rev-parse HEAD)"
            echo "image_os ${ImageOS:-}"
            echo "image_version ${ImageVersion:-}"
            echo "uname $(uname -sm)"
            sw_vers
          } | tee "$RUNNER_TEMP/identity.txt"

      - name: Unmodified host selftest once
        id: host
        if: always()
        run: |
          set +e
          LJ466_TIME=1 zsh lib/lanjump.zsh --host-selftest >"$RUNNER_TEMP/host.out" 2>"$RUNNER_TEMP/host.err"
          code=$?
          echo "$code" | tee "$RUNNER_TEMP/host.exit"
          exit "$code"

      - name: Trace solo once
        id: solo
        if: always()
        run: |
          set +e
          zsh diag/dns-490-trace.zsh "$RUNNER_TEMP/solo.trace" solo >"$RUNNER_TEMP/solo.out" 2>"$RUNNER_TEMP/solo.err"
          code=$?
          echo "$code" | tee "$RUNNER_TEMP/solo.exit"
          exit "$code"

      - name: Trace pair once
        id: pair
        if: always()
        run: |
          set +e
          zsh diag/dns-490-trace.zsh "$RUNNER_TEMP/pair.trace" pair >"$RUNNER_TEMP/pair.out" 2>"$RUNNER_TEMP/pair.err"
          code=$?
          echo "$code" | tee "$RUNNER_TEMP/pair.exit"
          exit "$code"

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-490-traces
          path: |
            ${{ runner.temp }}/identity.txt
            ${{ runner.temp }}/host.out
            ${{ runner.temp }}/host.err
            ${{ runner.temp }}/host.exit
            ${{ runner.temp }}/solo.trace
            ${{ runner.temp }}/solo.out
            ${{ runner.temp }}/solo.err
            ${{ runner.temp }}/solo.exit
            ${{ runner.temp }}/pair.trace
            ${{ runner.temp }}/pair.out
            ${{ runner.temp }}/pair.err
            ${{ runner.temp }}/pair.exit
          if-no-files-found: warn
